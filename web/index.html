<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>runcandell</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='3' y='4' width='4' height='8' fill='%2326a69a'/><rect x='9' y='2' width='4' height='9' fill='%23f5a524'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">runcandell</div>
      <div class="symbol" id="symbol">XAUUSD</div>
      <div class="tfs" id="tfs" role="group" aria-label="Timeframe"></div>
      <div class="spacer"></div>
      <form class="goto" id="goto">
        <input type="datetime-local" id="goto-input" aria-label="Lompat ke tanggal" />
        <button type="submit">Lompat</button>
      </form>
      <button type="button" id="latest" title="Ke candle terbaru">Terbaru</button>
      <select id="zone" aria-label="Zona waktu"></select>
    </header>

    <main class="workspace">
      <nav class="tools" id="tools" aria-label="Alat gambar">
        <button type="button" data-tool="cursor" title="Kursor (Esc)">
          <svg viewBox="0 0 20 20"><path d="M5 3l10 6-4.5 1.2L13 15l-1.8.9-2.4-4.8L5 14z" /></svg>
        </button>
        <button type="button" data-tool="hline" title="Garis horizontal">
          <svg viewBox="0 0 20 20"><path d="M2 10h16" /><circle cx="10" cy="10" r="1.8" /></svg>
        </button>
        <button type="button" data-tool="trend" title="Trendline">
          <svg viewBox="0 0 20 20"><path d="M4 16L16 4" /><circle cx="4" cy="16" r="1.8" /><circle cx="16" cy="4" r="1.8" /></svg>
        </button>
        <button type="button" data-tool="rect" title="Zona (kotak)">
          <svg viewBox="0 0 20 20"><rect x="3.5" y="5.5" width="13" height="9" /></svg>
        </button>
        <button type="button" data-tool="fib" title="Fibonacci retracement">
          <svg viewBox="0 0 20 20"><path d="M3 4h14M3 8h14M3 12h14M3 16h14" /></svg>
        </button>
        <div class="tools-sep"></div>
        <button type="button" id="delete-sel" title="Hapus gambar terpilih (Delete)">
          <svg viewBox="0 0 20 20"><path d="M5 6h10M8 6V4h4v2M6.5 6l.8 10h5.4l.8-10" /></svg>
        </button>
        <button type="button" id="clear-all" title="Hapus semua gambar">
          <svg viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" /></svg>
        </button>
      </nav>

      <section class="chart-wrap">
        <div class="legend" id="legend"></div>
        <div class="chart" id="chart"></div>
        <div class="overlay" id="overlay" hidden></div>
      </section>
    </main>

    <footer class="statusbar" id="status"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>runcandell</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='3' y='4' width='4' height='8' fill='%2326a69a'/><rect x='9' y='2' width='4' height='9' fill='%23f5a524'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">runcandell</div>
      <div class="symbol" id="symbol">XAUUSD</div>
      <div class="tfs" id="tfs" role="group" aria-label="Timeframe"></div>
      <div class="ind-wrap">
        <button type="button" id="ind-btn" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15l4-5 3 3 6-8" /></svg>
          Indikator
        </button>
        <div class="ind-menu" id="ind-menu" hidden></div>
      </div>
      <button type="button" id="replay-btn" aria-pressed="false" title="Bar replay + paper trading">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4v12M8 5l9 5-9 5z" /></svg>
        Replay
      </button>
      <button type="button" id="bt-btn" aria-pressed="false" title="Backtest strategi otomatis">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16h14M5 13l3-4 3 2 4-6" /><circle cx="15" cy="5" r="1.4" /></svg>
        Backtest
      </button>
      <button type="button" id="duel-btn" title="Duel: tebak arah dari potongan chart">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l8-8M12 4l4 4-2 2-4-4zM16 16l-8-8M8 4L4 8l2 2 4-4z" /></svg>
        Duel
      </button>
      <div class="spacer"></div>
      <form class="goto" id="goto">
        <input type="datetime-local" id="goto-input" aria-label="Lompat ke tanggal" />
        <button type="submit">Lompat</button>
      </form>
      <button type="button" id="latest" title="Ke candle terbaru">Terbaru</button>
      <select id="zone" aria-label="Zona waktu"></select>
      <button type="button" id="acct-btn" class="acct-btn">Masuk</button>
    </header>

    <main class="workspace">
      <nav class="tools" id="tools" aria-label="Alat gambar">
        <button type="button" data-tool="cursor" title="Kursor (Esc)">
          <svg viewBox="0 0 20 20"><path d="M5 3l10 6-4.5 1.2L13 15l-1.8.9-2.4-4.8L5 14z" /></svg>
        </button>
        <button type="button" data-tool="hline" title="Garis horizontal">
          <svg viewBox="0 0 20 20"><path d="M2 10h16" /><circle cx="10" cy="10" r="1.8" /></svg>
        </button>
        <button type="button" data-tool="trend" title="Trendline">
          <svg viewBox="0 0 20 20"><path d="M4 16L16 4" /><circle cx="4" cy="16" r="1.8" /><circle cx="16" cy="4" r="1.8" /></svg>
        </button>
        <button type="button" data-tool="rect" title="Zona (kotak)">
          <svg viewBox="0 0 20 20"><rect x="3.5" y="5.5" width="13" height="9" /></svg>
        </button>
        <button type="button" data-tool="fib" title="Fibonacci retracement">
          <svg viewBox="0 0 20 20"><path d="M3 4h14M3 8h14M3 12h14M3 16h14" /></svg>
        </button>
        <div class="tools-sep"></div>
        <button type="button" id="delete-sel" title="Hapus gambar terpilih (Delete)">
          <svg viewBox="0 0 20 20"><path d="M5 6h10M8 6V4h4v2M6.5 6l.8 10h5.4l.8-10" /></svg>
        </button>
        <button type="button" id="clear-all" title="Hapus semua gambar">
          <svg viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" /></svg>
        </button>
      </nav>

      <section class="chart-wrap">
        <div class="legend-stack">
          <div class="legend" id="legend"></div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="chart" id="chart"></div>
        <div class="pane-layer" id="pane-chips"></div>
        <div class="pick-line" id="pick-line" hidden></div>
        <div class="pick-bar" id="pick-bar" hidden>
          <span>Klik candle untuk titik mulai replay</span>
          <button type="button" data-p="random">Acak</button>
          <button type="button" data-p="cancel">Batal</button>
        </div>
        <div class="replay-bar" id="replay-bar" role="toolbar" aria-label="Kontrol replay" hidden>
          <button type="button" data-r="restart" title="Ulang dari titik awal" aria-label="Ulang dari titik awal">⏮</button>
          <button type="button" data-r="play" class="play">▶</button>
          <button type="button" data-r="step" title="Maju 1 candle (Shift+→)" aria-label="Maju 1 candle">⏭</button>
          <select data-r="speed" aria-label="Kecepatan"></select>
          <span class="clock" data-r="clock"></span>
          <label class="hide-date" title="Sembunyikan tanggal"><input type="checkbox" data-r="hide" /> <span>Sembunyikan </span>tanggal</label>
          <span class="spacer"></span>
          <button type="button" data-r="save" title="Simpan sesi ke akun">Simpan</button>
          <button type="button" data-r="exit">Keluar replay</button>
        </div>
        <div class="replay-bar duel-bar" id="duel-bar" role="toolbar" aria-label="Keputusan duel" hidden></div>
        <div class="pick-bar" id="price-pick" hidden></div>
        <div class="overlay" id="overlay" hidden></div>
      </section>
      <section class="bt" id="bt" aria-label="Backtest" hidden></section>
      <aside class="trade" id="trade" aria-label="Paper trading" hidden></aside>
    </main>

    <footer class="statusbar" id="status"></footer>
    <dialog id="ind-dialog" class="ind-dialog"></dialog>
    <dialog id="acct-dialog" class="acct-dialog" aria-label="Akun"></dialog>
    <dialog id="jr-dialog" class="jr-dialog" aria-label="Jurnal trade"></dialog>
    <dialog id="duel-dialog" class="acct-dialog" aria-label="Duel"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
